# ─── lazygit ──────────────────────────────────────────────────────────────
# Managed by polkadot. Found here because $XDG_CONFIG_HOME is exported in
# fish; without that, lazygit reads ~/Library/Application Support/lazygit.

gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  scrollHeight: 4
  sidePanelWidth: 0.3
  mainPanelSplitMode: flexible
  language: en
  timeFormat: "2006-01-02"
  shortTimeFormat: "15:04"
  commitLength:
    show: true
  # The theme is Subway Seat's, layered on by LG_CONFIG_FILE (set in
  # fish/conf.d/10-env.fish) so the colours stay generated, not copied here.
git:
  pagers:
    - # delta is already the git pager; reuse it here so diffs look identical
      # whichever tool you are reading them in.
      colorArg: always
      pager: delta --dark --paging=never
  commit:
    signOff: false
  merging:
    args: ""
  parseEmoji: false
  # Log graph on, because the shape of history is the reason to be in lazygit.
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
  autoFetch: true
  autoRefresh: true
  fetchAll: false
os:
  # No editPreset: lazygit ships presets for vim, helix, vscode and the
  # rest, and fresh is not among them, so the commands are given outright.
  # Open files at the right line when you press `e`. `file:line` is
  # fresh's own location syntax.
  edit: "fresh {{filename}}"
  editAtLine: "fresh {{filename}}:{{line}}"
refresher:
  refreshInterval: 10
  fetchInterval: 60
confirmOnQuit: false
disableStartupPopups: true
notARepository: "skip"
promptToReturnFromSubprocess: false
keybinding:
  universal:
    # `q` quits, but only from the top level; nested views should just close.
    quit: "q"
    return: "<esc>"
  files:
    commitChangesWithEditor: "C"
