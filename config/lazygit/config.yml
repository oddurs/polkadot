# ─── lazygit ──────────────────────────────────────────────────────────────
# Managed by polkadot. Found here because $XDG_CONFIG_HOME is exported in
# fish; without that, lazygit reads ~/Library/Application Support/lazygit.
#
# Colours are not set here. `polkadot theme` places Subway Seat's lazygit
# files beside this one and exports LG_CONFIG_FILE so that both are read,
# this first and the flavor second — so switching flavor never means editing
# this file.

gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  scrollHeight: 4
  sidePanelWidth: 0.3
  mainPanelSplitMode: flexible
  language: en
  timeFormat: "2006-01-02"
  shortTimeFormat: "15:04"
  commitLength:
    show: true
  # The diff is the reason to be here; give it the room.
  expandFocusedSidePanel: true
  filterMode: fuzzy

git:
  paging:
    # delta is already the git pager; reuse it here so a diff looks identical
    # whichever tool you are reading it in.
    colorArg: always
    pager: delta --dark --paging=never
  commit:
    signOff: false
  merging:
    args: ""
  parseEmoji: false
  # Log graph on, because the shape of history is the reason to be in lazygit.
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
  autoFetch: true
  autoRefresh: true
  fetchAll: false
  # Never rewrite somebody else's history by reflex.
  skipHookPrefix: WIP
  mainBranches: [main, master, trunk]

os:
  editPreset: "fresh"
  edit: "fresh {{filename}}"
  editAtLine: "fresh +{{line}} {{filename}}"

refresher:
  refreshInterval: 10
  fetchInterval: 60

confirmOnQuit: false
disableStartupPopups: true
notARepository: "skip"
promptToReturnFromSubprocess: false

keybinding:
  universal:
    # `q` quits, but only from the top level; nested views should just close.
    quit: "q"
    return: "<esc>"
  files:
    commitChangesWithEditor: "C"

# Custom commands for the workflow this machine actually uses: one unit of
# work, one worktree, one branch, one pull request.
customCommands:
  - key: "W"
    context: "localBranches"
    description: "worktree + branch for a new unit of work"
    prompts:
      - type: "input"
        title: "branch (<type>/<slug>)"
        initialValue: ""
    command: "scripts/agent start {{index .PromptResponses 0}}"
    subprocess: true
  - key: "P"
    context: "localBranches"
    description: "check, push, open the pull request"
    command: "scripts/agent pr"
    subprocess: true
  - key: "c"
    context: "commits"
    description: "checks for the PR this commit is on"
    command: "gh pr checks --watch"
    subprocess: true
