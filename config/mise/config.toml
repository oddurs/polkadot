# ─── mise ─────────────────────────────────────────────────────────────────
# One version manager, replacing nvm and pyenv. Per-project versions come from
# .tool-versions, .nvmrc, .node-version or mise.toml — all of which mise reads.
# These are the fallbacks for a directory that pins nothing.

[tools]
# A major version, not "lts": the name "lts" moves to a new major when one
# becomes LTS. A machine set up after that day then runs a different Node
# from the others, and doctor reports the old machines as missing a tool.
node = "24"
python = "3.13"
go = "latest"

# ─── command-line tools ───────────────────────────────────────────────────
# Pinned, so every machine runs the same version. To update a tool, change
# its version here in a pull request; each machine follows at its next sync.
age = "1.3.2"
atuin = "18.25.1"
bat = "0.26.1"
delta = "0.21.2"
direnv = "2.38.2"
dust = "1.2.7"
eza = "0.23.5"
fd = "10.5.2"
fzf = "0.75.0"
gh = "2.105.0"
glow = "3.0.0"
hyperfine = "2.0.0"
jq = "1.8.2"
just = "1.59.0"
lazydocker = "0.25.2"
lazygit = "0.66.3"
ripgrep = "15.2.0"
sd = "1.1.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
sops = "3.13.3"
starship = "1.27.0"
uv = "0.13.9"
watchexec = "2.8.0"
yq = "4.54.3"
zoxide = "0.10.0"
# The fresh editor, from its GitHub releases. Its npm package needs an
# install script, and mise does not run install scripts.
"github:sinelaw/fresh" = "0.5.9"

# These three have a build for one system only. Homebrew installs btop and
# difftastic on macOS (packages/darwin.Brewfile). tlrc has no Linux arm64
# build. tokei is in the Brewfile too: mise builds it with cargo.
btop = { version = "1.4.8", os = ["linux"] }
difftastic = { version = "0.72.0", os = ["linux"] }
tlrc = { version = "1.13.1", os = ["macos"] }

[settings]
# Install a missing version automatically when you cd into a project that
# pins it, rather than erroring and making you do it by hand.
idiomatic_version_file_enable_tools = ["node", "python"]
experimental = true
jobs = 4
