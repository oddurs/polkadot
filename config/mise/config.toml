# ─── mise ─────────────────────────────────────────────────────────────────
# One version manager, replacing nvm and pyenv. Per-project versions come from
# .tool-versions, .nvmrc, .node-version or mise.toml — all of which mise reads.
# These are the fallbacks for a directory that pins nothing.

[tools]
node = "lts"
python = "3.13"
go = "latest"

# The command-line tools, for Linux. Homebrew still installs them on macOS,
# so each entry is limited to Linux until the Brewfile hands them over.
# tokei is absent: mise builds it with cargo, and a server has no Rust.
# tlrc is absent: it publishes no build for Linux on arm64.
age = { version = "latest", os = ["linux"] }
atuin = { version = "latest", os = ["linux"] }
bat = { version = "latest", os = ["linux"] }
btop = { version = "latest", os = ["linux"] }
delta = { version = "latest", os = ["linux"] }
difftastic = { version = "latest", os = ["linux"] }
direnv = { version = "latest", os = ["linux"] }
dust = { version = "latest", os = ["linux"] }
eza = { version = "latest", os = ["linux"] }
fd = { version = "latest", os = ["linux"] }
fzf = { version = "latest", os = ["linux"] }
gh = { version = "latest", os = ["linux"] }
glow = { version = "latest", os = ["linux"] }
hyperfine = { version = "latest", os = ["linux"] }
jq = { version = "latest", os = ["linux"] }
just = { version = "latest", os = ["linux"] }
lazydocker = { version = "latest", os = ["linux"] }
lazygit = { version = "latest", os = ["linux"] }
ripgrep = { version = "latest", os = ["linux"] }
sd = { version = "latest", os = ["linux"] }
sops = { version = "latest", os = ["linux"] }
starship = { version = "latest", os = ["linux"] }
uv = { version = "latest", os = ["linux"] }
watchexec = { version = "latest", os = ["linux"] }
yq = { version = "latest", os = ["linux"] }
zoxide = { version = "latest", os = ["linux"] }
# The fresh editor, from its GitHub releases. Its npm package needs an
# install script, and mise does not run install scripts.
"github:sinelaw/fresh" = { version = "latest", os = ["linux"] }

[settings]
# Install a missing version automatically when you cd into a project that
# pins it, rather than erroring and making you do it by hand.
idiomatic_version_file_enable_tools = ["node", "python"]
experimental = true
jobs = 4
