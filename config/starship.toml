# ─── starship ─────────────────────────────────────────────────────────────
# Managed by polkadot. The palette is Subway Seat's, appended at the end of
# this file by its installer — this file names roles, never hex.
#
# A powerline prompt: every segment carries a background, and the divider
# between two of them is a  drawn in the previous background on top of the
# next one. That is the whole trick, and it is why the order of the format
# string matters more than usual — a segment that can vanish has to hand its
# background to whatever follows, or the bar tears.
#
# Three prompts, not one:
#
#   format            the live prompt — who, where, what git thinks
#   right_format      how long the last thing took, and the clock
#   transient         what the prompt collapses to once the command has run
#
# Transience is why scrollback stays readable: a screen of history is a column
# of `❯❯❯ command` with a timestamp on the right, not the same bar forty times.
#
# The glyphs are Nerd Font — JetBrainsMono Nerd Font, in the Brewfile. Without
# one, every separator and icon renders as tofu.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](blue)\
$username\
[](fg:blue bg:color_bg3)\
$directory\
[](fg:color_bg3 bg:purple)\
$git_branch$git_status$git_state$git_metrics\
[](fg:purple bg:cyan)\
$nodejs$python$golang$rust$php\
$container$docker_context$kubernetes\
[](fg:cyan)\
$line_break\
$status$jobs$character"""

right_format = """$cmd_duration$battery$time"""

add_newline = true
# node --version can exceed the 500ms default on a cold cache, and a runtime
# segment that flickers takes its background with it.
command_timeout = 1500
palette = 'london_moquette'

# Three chevrons, warming left to right so the eye lands on the last one —
# where the cursor sits. A failed command turns all three red, legible in a
# screen of scrollback without reading the exit code.
[character]
success_symbol = '[❯](bright-red)[❯](purple)[❯](yellow)'
error_symbol = '[❯](red)[❯](red)[❯](bright-red)'
vimcmd_symbol = '[❮](green)[❮](cyan)[❮](blue)'
vimcmd_replace_symbol = '[❮](purple)[❮](purple)[❮](yellow)'
vimcmd_visual_symbol = '[❮](cyan)[❮](blue)[❮](bright-blue)'

# starship shows this only over SSH or as root by default. Always here: it is
# where the bar starts, and without it the prompt opens on a floating divider.
[username]
disabled = false
show_always = true
style_user = 'fg:color_fg0 bg:blue bold'
style_root = 'fg:color_fg0 bg:red bold'
format = '[ $user ]($style)'

[directory]
style = 'fg:bright-white bg:color_bg3'
format = '[ $path ]($style)[$read_only]($read_only_style)'
# Not truncate_to_repo: two directories deep in a monorepo looks identical to
# its root when all you print is the repo name.
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' ro '
read_only_style = 'fg:bright-black bg:color_bg3'

[directory.substitutions]
# Only where the icon earns its space. ~/Code is most of this machine, and
# `</> code/polkadot` reads as markup rather than as a path.
'Documents' = ' docs'
'Downloads' = ' dl'

[git_branch]
style = 'fg:color_fg0 bg:purple'
symbol = ' '
format = '[ $symbol$branch ]($style)'
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'fg:color_fg0 bg:purple'
format = '([$all_status$ahead_behind]($style))'
conflicted = '≠${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↕↑${ahead_count}↓${behind_count} '
untracked = '?${count} '
stashed = '≡${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '−${count} '

# Lines changed, so the size of what you are about to commit is visible
# without running a diff.
[git_metrics]
disabled = false
added_style = 'fg:color_fg0 bg:purple bold'
deleted_style = 'fg:color_fg0 bg:purple'
format = '([+$added]($added_style))([−$deleted]($deleted_style))[ ](bg:purple)'
only_nonzero_diffs = true

[git_state]
style = 'fg:color_fg0 bg:purple bold'
format = '[ \($state( $progress_current/$progress_total)\) ]($style)'

# Runtimes share one cyan segment, so two of them read as a single block
# rather than two bars.
[nodejs]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol($version) ]($style)'
detect_files = ['package.json', '.nvmrc', '.node-version', '.tool-versions', 'mise.toml']

[python]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol($version)(\($virtualenv\)) ]($style)'

[golang]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol($version) ]($style)'

[rust]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol($version) ]($style)'

[php]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol($version) ]($style)'

[container]
style = 'fg:color_fg0 bg:cyan'
format = '[ ⬢ $name ]($style)'

[docker_context]
style = 'fg:color_fg0 bg:cyan'
symbol = ' '
format = '[ $symbol$context ]($style)'
only_with_files = true

[kubernetes]
disabled = false
style = 'fg:color_fg0 bg:cyan'
symbol = '☸ '
format = '[ $symbol$context( \($namespace\)) ]($style)'

# ─── the second line ──────────────────────────────────────────────────────
# Below the bar, on the terminal background: what is about the last command
# rather than about where you are.

# The exit code, and nothing else.
#
# `map_symbol` prints starship's own wording for the common codes — a typo'd
# command becomes "? NOTFOUND", which is jargon for a thing the three red
# chevrons have already said. The number is the part you cannot get anywhere
# else, so that is what is shown: `✗ 127`. Signals keep their name, because
# `✗ SIGSEGV` and `✗ 1` are different news.
[status]
disabled = false
style = 'bold red'
symbol = '✗'
not_found_symbol = '✗'
not_executable_symbol = '✗'
sigint_symbol = '✗'
signal_symbol = '✗'
map_symbol = true
# `$maybe_int` is empty whenever map_symbol resolves a code, which is most of
# the time — `$status` always carries the number. Signals add their name after
# it, because 139 and SEGV are the same fact said twice only if you know the
# table by heart. Ctrl-C still reports, as `✗ 130 INT`: it is not an error, but
# a command that died on a signal you sent is still worth seeing.
recognize_signal_code = true
format = '[$symbol $status( $signal_name)]($style) '
pipestatus = true
pipestatus_format = '[$pipestatus]($style) '

[jobs]
style = 'purple'
symbol = '⏵'
format = '[$symbol$number]($style) '
number_threshold = 1
symbol_threshold = 1

# ─── right side ───────────────────────────────────────────────────────────

[cmd_duration]
style = 'bright-black'
min_time = 2000
format = '[$duration]($style) '
show_milliseconds = false

# Only when it matters.
[battery]
format = '[$symbol$percentage]($style) '
disabled = false
[[battery.display]]
threshold = 20
style = 'red'
[[battery.display]]
threshold = 40
style = 'yellow'

[time]
disabled = false
style = 'bright-black'
format = '[$time]($style)'
time_format = '%H:%M'

# Off: always true, or never interesting.
[hostname]
disabled = true
[package]
disabled = true
[aws]
disabled = true
[cmake]
disabled = true

