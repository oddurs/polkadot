# ─── starship ─────────────────────────────────────────────────────────────
# Managed by polkadot. Gotham palette.
#
# Three prompts, not one:
#
#   format            the live prompt — where you are, what git thinks, what
#                     runtime is pinned
#   right_format      how long the last thing took, and the clock
#   transient         what the prompt collapses to once the command has run
#
# Transience is the reason scrollback stays readable: a screen of history is a
# column of `❯ command` with a timestamp on the right, instead of the same
# path repeated forty times.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch$git_status$git_state$git_metrics\
$nodejs$python$golang$rust$php\
$container$docker_context$kubernetes\
$line_break\
$status$jobs$character"""

right_format = """$cmd_duration$battery$time"""

add_newline = true
# node --version can exceed the 500ms default on a cold cache, which makes the
# runtime segment flicker in and out.
command_timeout = 1500
palette = 'gotham'

[palettes.gotham]
bg      = '#0a0f14'
surface = '#10151b'
panel   = '#081f2d'
border  = '#245361'
muted   = '#4e5165'
comment = '#888ba5'
subtle  = '#599caa'
fg      = '#98d1ce'
bright  = '#d3ebe9'
red     = '#c33027'
orange  = '#d26939'
yellow  = '#edb54b'
green   = '#26a98b'
blue    = '#195465'
cyan    = '#33859d'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](yellow)'
vimcmd_replace_symbol = '[❮](orange)'
vimcmd_visual_symbol = '[❮](cyan)'

# The exit code, only when there was one. `signal_symbol` catches the ones you
# actually care about — a ^C reads differently from a segfault.
[status]
disabled = false
style = 'red'
symbol = '✗'
# SIGINT has its own symbol and defaults to an emoji; a literal ^C is what you
# actually pressed.
sigint_symbol = '^C'
signal_symbol = '⚡'
not_found_symbol = '?'
not_executable_symbol = '🚫'
format = '[$symbol $common_meaning$signal_name$maybe_int]($style) '
map_symbol = true
pipestatus = true
pipestatus_format = '[$pipestatus]($style) '

[jobs]
style = 'orange'
symbol = '⏵'
format = '[$symbol$number]($style) '
number_threshold = 1
symbol_threshold = 1

[directory]
style = 'bold subtle'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' ro'
read_only_style = 'muted'

[directory.substitutions]
'~/Code' = ' code'
'~/Notes' = ' notes'
'Documents' = ' docs'
'Downloads' = ' dl'

[git_branch]
style = 'cyan'
symbol = ' '
format = 'on [$symbol$branch]($style) '
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'orange'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '≠${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↕↑${ahead_count}↓${behind_count} '
untracked = '?${count} '
stashed = '≡${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '−${count} '

# Lines changed, so you know the size of what you are about to commit without
# running a diff.
[git_metrics]
disabled = false
added_style = 'green'
deleted_style = 'red'
format = '([+$added]($added_style))([−$deleted]($deleted_style)) '
only_nonzero_diffs = true

[git_state]
style = 'red'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Runtimes: shown only where the project actually pins one.
[nodejs]
style = 'green'
symbol = ' '
format = '[$symbol($version )]($style)'
detect_files = ['package.json', '.nvmrc', '.node-version', '.tool-versions', 'mise.toml']

[python]
style = 'yellow'
symbol = ' '
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[golang]
style = 'cyan'
symbol = ' '
format = '[$symbol($version )]($style)'

[rust]
style = 'orange'
symbol = ' '
format = '[$symbol($version )]($style)'

[php]
style = 'comment'
symbol = ' '
format = '[$symbol($version )]($style)'

[container]
style = 'comment'
format = '[⬢ $name]($style) '

[docker_context]
style = 'blue'
symbol = ' '
format = '[$symbol$context]($style) '
only_with_files = true

[kubernetes]
disabled = false
style = 'comment'
symbol = '☸ '
format = '[$symbol$context( \($namespace\))]($style) '

# ─── right side ───────────────────────────────────────────────────────────

[cmd_duration]
style = 'muted'
min_time = 2000
format = '[$duration]($style) '
show_milliseconds = false

# Only when it matters.
[battery]
format = '[$symbol$percentage]($style) '
disabled = false
[[battery.display]]
threshold = 20
style = 'red'
[[battery.display]]
threshold = 40
style = 'yellow'

[time]
disabled = false
style = 'border'
format = '[$time]($style)'
time_format = '%H:%M'

# Off: always true, or never interesting.
[hostname]
disabled = true
[username]
disabled = true
[package]
disabled = true
[aws]
disabled = true
[cmake]
disabled = true
